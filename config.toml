# Minivan finder settings. Edit and the next run picks them up.

[general]
# Shown on the report page and in notifications.
title = "Minivan Finder"
# Who maintains this copy. The ask service tells people to ask this person for changes.
maintainer = "Pete"
# Where the shoppers live, for the ask service's prompt.
home_area = "Austin, TX"
# Time zone for the run schedule and the ask service's daily limit.
timezone = "America/Chicago"
# Hours of the day (24-hour, in timezone) when run_daily.sh does a run. Cron calls it every hour.
run_hours = [7, 16]
# Show cargo space (cubic feet) on the report cards and in notifications.
show_cargo = true

[search]
# Vehicles to search for. Keys and cargo specs live in finder/models.py:
# sienna, odyssey, highlander, pilot, 4runner, rav4, crv, venza, priusv, prius, element, rx, gx, mdx, rdx,
# rogue, altima, sentra, murano, pathfinder, quest, versa, kicks, camry, corolla, avalon, accord, civic, es
models = ["sienna", "odyssey", "highlander", "pilot", "4runner", "rav4", "crv", "venza", "priusv", "prius", "element",
          "rx", "gx", "mdx", "rdx"]
origin_name = "McNeil Dr & US-183, Austin"
origin_lat = 30.4380
origin_lon = -97.7590
origin_zip = "78750"
radius_miles = 250
min_year = 2011
max_mileage = 150000
price_min = 6000
price_max = 10000
# Listings this far outside the price range are kept as "near misses".
near_miss_margin = 500
# Report-page "Within N mi" filter choices: [driving miles, place name shown in brackets or ""].
distance_filters = [[30, ""], [90, "San Antonio"], [180, "Houston"], [220, "DFW"]]

[deals]
# Cars.com is searched across this wider price band to learn what each model/year/mileage sells for.
market_price_min = 5000
market_price_max = 16000

[sources]
carscom = true
autotrader = true
carmax = true
craigslist = true
facebook = true
# Facebook Marketplace city slugs to search (logged out, first page of results each).
facebook_cities = ["austin", "sanantonio", "houston", "dallas"]
# Your nearest Craigslist site (the subdomain of <site>.craigslist.org). The search itself uses origin_zip
# and radius_miles; this is only sent as the Referer, which the search API expects.
craigslist_site = "austin"

[ntfy]
server = "https://ntfy.sh"
# Anyone who knows the topic name can read it, so set it in config.local.toml
# (not committed), e.g.  [ntfy]  topic = "carfinder-<random>"
topic = ""
# Errors (failing sites, crashed runs, failed publishes) go to ops_topic if set, also in config.local.toml.
# Questions posted to ask_topic (also in config.local.toml) are answered by scripts/ask.py.
notify_near_misses = true
# Warn when a source has failed this many runs in a row.
source_failure_alert_after = 3

[ask]
# scripts/ask.py answers questions posted to the ntfy ask_topic using Claude.
model = "sonnet"
# Questions answered per day (Central time) before it stops and warns ops_topic.
daily_limit = 20

[publish]
# The report is pushed to docs/ in this repo; GitHub Pages serves that folder.
repo = "git@github.com:petenelson/our-car-finder-report.git"
branch = "main"
checkout = "pages"
path = "docs"
page_url = "https://petenelson.github.io/our-car-finder-report/"
